    // document mints the blobs for its OWN frames, obtaining page text

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      delete pendingRelays[uuid];

      // root's never-relay rule) are what hold in fully opaque chains

      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        UUID_SHAPE.test(d.__bundler_page) &&

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

      template = template.slice(0, i) + resourceScript + template.slice(i);

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\"position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; align-items:center; gap:24px; width:max-content;\">\n          <div style=\"display:flex; align-items:center; gap:24px; transform:translateX({{ trackOffset }}); transition:transform 0.5s cubic-bezier(0.22,1,0.36,1);\">\n            <sc-for list=\"{{ testimonials }}\" as=\"t\" hint-placeholder-count=\"12\">\n              <div sc-camel-on-click=\"{{ t.onClick }}\" style=\"{{ t.cardStyle }}\">\n                <p style=\"font-family:Georgia,serif; font-style:italic; font-weight:700; font-size:{{ t.headlineSize }}; line-height:1.4; color:#1B65AF; margin:0 0 16px;\">{{ t.headline }}<\u002Fp>\n                <p style=\"font-family:Aileron,sans-serif; font-size:{{ t.bodySize }}; line-height:1.6; color:#1B65AF; margin:0 0 24px; flex:1;\">{{ t.body }}<\u002Fp>\n                <p style=\"font-size:14px; letter-spacing:1px; color:#5a5a5a; margin:0;\">{{ t.author }}<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; justify-content:center; gap:12px; margin-top:44px;\">\n        <sc-for list=\"{{ dots }}\" as=\"d\" hint-placeholder-count=\"4\">\n          <span sc-camel-on-click=\"{{ d.onClick }}\" style=\"width:10px; height:10px; border-radius:50%; background:{{ d.bg }}; border:1.5px solid #FEFCED; box-sizing:border-box; cursor:pointer;\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACTO -->\n  <section id=\"contacto\" style=\"{{ contactoSectionStyle }}\" data-om-label=\"contacto\">\n    <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; align-items:flex-end; justify-content:center; gap:4px; margin-bottom:48px;\">\n        <h2 data-reveal-id=\"contactoTitle\" style=\"{{ reveal.contactoTitle }} font-family:Georgia,serif; font-style:italic; font-size:{{ contactoTitleSize }}; text-align:center; color:#5A9AF3; margin:0; font-weight:400;\">CON<\u002Fh2>\n        <h2 data-reveal-id=\"contactoTitle\" style=\"{{ reveal.contactoTitle }} font-family:Aileron,sans-serif; font-style:normal; font-size:{{ contactoTitleSize }}; text-align:center; color:#5A9AF3; margin:0; font-weight:400;\">TÁCTAME<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ !isMobile }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:60px;\">\n        <h2 data-reveal-id=\"contactoTitle\" style=\"{{ reveal.contactoTitle }} font-family:Georgia,serif; font-style:italic; font-size:{{ contactoTitleSize }}; text-align:center; color:#5A9AF3; margin:0; font-weight:400;\">CON<\u002Fh2>\n        <h2 data-reveal-id=\"contactoTitle\" style=\"{{ reveal.contactoTitle }} font-family:Aileron,sans-serif; font-style:normal; font-size:{{ contactoTitleSize }}; text-align:center; color:#5A9AF3; margin:0; font-weight:400;\">TÁCTAME<\u002Fh2>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <div data-reveal-id=\"contacto\" style=\"{{ contactoGridStyle }}\">\n      <div style=\"{{ contactoCellStyle }}\">\n        <img src=\"2aa64df8-9f03-4806-bb3e-54028f957264\" alt=\"\" style=\"{{ contactoIconStyle }}\">\n        <div style=\"{{ contactoTextWrapStyle }}\">\n        <p style=\"font-size:15px; letter-spacing:1.5px; font-weight:700; color:#1B65AF; margin:0 0 8px;\">DIRECCIÓN<\u002Fp>\n        <p style=\"font-size:16px; line-height:1.5; margin:0; color:#2a2a2a;\">Av. Olímpica 3428, San Salvador<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"{{ contactoCellStyle }}\" data-x=\"2\">\n        <img src=\"09810258-8f02-4c2a-9a24-d09435142863\" alt=\"\" style=\"{{ contactoIconStyle }}\">\n        <div style=\"{{ contactoTextWrapStyle }}\">\n        <p style=\"font-size:15px; letter-spacing:1.5px; font-weight:700; color:#1B65AF; margin:0 0 8px;\">HORARIO<\u002Fp>\n        <p style=\"font-size:16px; line-height:1.5; margin:0; color:#2a2a2a;\">Martes a sábado | 9 AM–6PM<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:{{ contactoLastPad }}; display:{{ contactoLastDisplay }}; align-items:flex-start; gap:14px;\">\n        <img src=\"0ab74384-0906-43b7-ac7f-83176aa91fd2\" alt=\"\" style=\"{{ contactoIconStyle }}\">\n        <div style=\"{{ contactoTextWrapStyle }}\">\n        <p style=\"font-size:15px; letter-spacing:1.5px; font-weight:700; color:#1B65AF; margin:0 0 8px;\">MODALIDAD<\u002Fp>\n        <p style=\"font-size:16px; line-height:1.5; margin:0; color:#2a2a2a;\">Presencial y virtual<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CTA + FORM -->\n  <section id=\"cita\" style=\"background: #5A9AF3; padding: {{ citaSectionPad }}\">\n    <div data-reveal-id=\"form\" style=\"{{ formGridStyle }}\">\n      <div style=\"display:flex; flex-direction:column; align-items:{{ citaLeftAlignItems }}; text-align:{{ citaLeftTextAlign }};\">\n        <h2 style=\"font-family: Georgia,serif; font-style: italic; font-size: {{ citaTitleSize }}; line-height: 1.2; color: #FEFCED; margin: 0 0 16px; font-weight: 400\">Cuéntame un poco de ti<\u002Fh2>\n        <p style=\"font-family: Georgia,serif; font-style: italic; font-size: 18px; color: #FEFCED; margin: 0 0 36px\">y encontremos el mejor momento para conversar.<\u002Fp>\n        <a href=\"https:\u002F\u002Fcalendly.com\u002Fpsicologaanaguzman\u002F1hr\" target=\"_blank\" rel=\"noopener\" style=\"display: inline-flex; align-items: center; gap: 10px; background: transparent; color: #FEFCED; font-size: 20px; font-weight: 500; padding: 18px 40px; border-radius: 999px; border: 2px solid #FEFCED; text-decoration: none; transition: all 0.35s cubic-bezier(.22,1,.36,1)\" style-hover=\"background:#FEFCED; color:#5A9AF3; transform:translateY(-3px); box-shadow:0 14px 28px rgba(27,101,175,0.32);\" style-active=\"transform:translateY(-1px) scale(0.97);\">Agenda tu cita →<\u002Fa>\n        <p style=\"font-size: 14px; color: #FEFCED; margin: 20px 0 0\">Te llevará a mi calendario de disponibilidad.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"background:#EBC6D0; border-radius:28px; padding:{{ formCardPad }}; display:flex; flex-direction:column; gap:24px;\">\n          <div style=\"display:flex; align-items:center; gap:16px; margin:0 0 4px;\">\n            <div style=\"flex:1; height:1px; background:#1B65AF;\"><\u002Fdiv>\n            <p style=\"font-size: 14px; color: #1B65AF; margin: 0; white-space:nowrap; font-weight:600;\">o escríbeme directamente<\u002Fp>\n            <div style=\"flex:1; height:1px; background:#1B65AF;\"><\u002Fdiv>\n          <\u002Fdiv>\n        <label style=\"display:flex; flex-direction:column; gap:8px; font-size:16px; font-weight:600; color:#1a1a1a;\">Nombre *\n          <input type=\"text\" placeholder=\"Tu nombre completo\" value=\"{{ formName }}\" sc-camel-on-change=\"{{ onNameChange }}\" style=\"{{ inputStyle }}\" style-focus=\"border-color:#1B65AF; box-shadow:0 0 0 4px rgba(27,101,175,0.12);\">\n        <\u002Flabel>\n        <label style=\"display:flex; flex-direction:column; gap:8px; font-size:16px; font-weight:600; color:#1a1a1a;\">Correo electrónico *\n          <input type=\"email\" placeholder=\"tucorreo@ejemplo.com\" value=\"{{ formEmail }}\" sc-camel-on-change=\"{{ onEmailChange }}\" style=\"{{ inputStyle }}\" style-focus=\"border-color:#1B65AF; box-shadow:0 0 0 4px rgba(27,101,175,0.12);\">\n        <\u002Flabel>\n        <label style=\"display:flex; flex-direction:column; gap:8px; font-size:16px; font-weight:600; color:#1a1a1a;\">Mensaje *\n          <textarea placeholder=\"Cuéntame en qué puedo ayudarte\" rows=\"4\" value=\"{{ formMessage }}\" sc-camel-on-change=\"{{ onMessageChange }}\" style=\"{{ inputStyle }} resize:none; font-family:inherit;\" style-focus=\"border-color:#1B65AF; box-shadow:0 0 0 4px rgba(27,101,175,0.12);\"><\u002Ftextarea>\n        <\u002Flabel>\n        <sc-if value=\"{{ formError }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size:14px; color:#b3261e; margin:-8px 0 0; font-weight:600;\">{{ formError }}<\u002Fp>\n        <\u002Fsc-if>\n        <a href=\"{{ mailtoHref }}\" sc-camel-on-click=\"{{ onSubmit }}\" style=\"align-self:stretch; justify-content:center; display:inline-flex; align-items:center; gap:10px; background:transparent; color:#1B65AF; font-size:18px; font-weight:500; padding:16px 32px; border-radius:999px; border:2px solid #1B65AF; cursor:pointer; text-decoration:none; text-align:center; transition:all 0.35s cubic-bezier(.22,1,.36,1);\" style-hover=\"background:#1B65AF; color:#FEFCED; transform:translateY(-2px); box-shadow:0 10px 22px rgba(27,101,175,0.3);\" style-active=\"transform:translateY(0) scale(0.96);\">Enviar →<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ showConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed; inset:0; background:rgba(27,101,175,0.35); display:flex; align-items:center; justify-content:center; z-index:200;\">\n        <div style=\"background:#FEFCED; border-radius:24px; padding:48px; max-width:440px; width:90%; position:relative; text-align:center; box-shadow:0 24px 60px rgba(0,0,0,0.25);\">\n          <button sc-camel-on-click=\"{{ closeConfirm }}\" aria-label=\"Cerrar\" style=\"position:absolute; top:18px; right:18px; width:32px; height:32px; border-radius:50%; border:none; background:transparent; color:#1B65AF; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;\">×<\u002Fbutton>\n          <h3 style=\"font-family:Georgia,serif; font-style:italic; font-size:26px; color:#1B65AF; margin:0 0 12px; font-weight:400;\">¡Mensaje enviado!<\u002Fh3>\n          <p style=\"font-size:16px; line-height:1.6; color:#2a2a2a; margin:0;\">Gracias por escribirme. Te responderé pronto, y hemos enviado una copia de tu mensaje a tu correo.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"padding: 70px 48px 40px; background-color: #FEFCED\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px\">\n      <div style=\"display: flex; align-items: center; gap: 0px\">\n        <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 34 34\" style=\"background: url(&quot;d9075ff0-d4ed-4d1e-9662-02268e8de20b&quot;) center \u002F cover no-repeat; width: 98px; height: 98px; aspect-ratio: 1:1; box-sizing: content-box\"><circle cx=\"22\" cy=\"17\" r=\"10\" fill=\"none\" stroke=\"#FEFCED\" stroke-width=\"2.2\" style=\"display: none\"><\u002Fcircle><\u002Fsvg>\n        <span style=\"font-size: 16px; letter-spacing: 3px; font-weight: 400; color: #1B65AF\">ANA GUZMÁN<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size: 15px; color: #1B65AF; max-width: 440px; line-height: 1.6; margin: 0\">Neuropsicóloga clínica. Un espacio seguro para tu bienestar emocional, presencial y virtual.<\u002Fp>\n      <div style=\"display:flex; gap:16px; margin:10px 0;\">\n        <a href=\"https:\u002F\u002Fwww.instagram.com\u002Fpsicanaguzman\u002F\" target=\"_blank\" rel=\"noopener\" style=\"width: 38px; height: 38px; border-radius: 50%; background: #AFBAF9; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;\" style-hover=\"background:#5A9AF3;\" style-active=\"background:#5A9AF3;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" style=\"background: url(&quot;7cfa49cc-81ff-48b4-aaae-13b5a12369cc&quot;) center \u002F cover no-repeat\"><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"https:\u002F\u002Fwww.tiktok.com\u002F@psic.ana.guzmn?_r=1&amp;_t=ZS-98deQhSBkSA\" target=\"_blank\" rel=\"noopener\" style=\"width: 38px; height: 38px; border-radius: 50%; background: #AFBAF9; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;\" style-hover=\"background:#5A9AF3;\" style-active=\"background:#5A9AF3;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" style=\"background: url(&quot;370bc580-1c1b-4be4-9877-593d092d7090&quot;) center \u002F cover no-repeat\"><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"https:\u002F\u002Fwa.me\u002Fmessage\u002FCUUVUC557PROG1\" target=\"_blank\" rel=\"noopener\" style=\"width: 38px; height: 38px; border-radius: 50%; background: #AFBAF9; display: flex; align-items: center; justify-content: center; transition: all 0.3s ease;\" style-hover=\"background:#5A9AF3;\" style-active=\"background:#5A9AF3;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 16 16\" style=\"background: url(&quot;a32ea595-f5ef-45c9-97e6-a95ab738c54c&quot;) center \u002F cover no-repeat\"><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n      <p style=\"font-size: 13px; color: #1B65AF; opacity: 0.5; margin: 14px 0 0\">© Ana Guzmán · Neuropsicóloga clínica<\u002Fp>\n      <p style=\"font-size: 13px; color: #1B65AF; opacity: 0.5; margin: 0\">JVPP: 11033<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text\u002Fx-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;serviceActiveBg&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#5A9AF3&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Servicios buttons&quot;},\n  &quot;serviceActiveText&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#FEFCED&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Servicios buttons&quot;}\n}\">\nconst TAGS = ['Ansiedad','Depresión','Manejo del estrés','Gestión emocional y autoestima','Problemas de memoria','Problemas de atención','Dificultades de organización y planificación','Habilidades sociales','Deterioro o daño cognitivo'];\n\nclass Component extends DCLogic {\n  state = al-id');\n      if (id && !this.state.visible[id] && el.getBoundingClientRect().top < window.innerHeight * 0.9) {\n        this.setState(s => (s.visible[id] ? null : { visible: { ...s.visible, [id]: true } }));\n        if (this._observer) this._observer.unobserve(el);\n      }\n    });\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._onScroll);\n    window.removeEventListener('resize', this._onResize);\n    if (this._observer) this._observer.disconnect();\n  }\n\n  revealStyle(id) {\n    const shown = !!this.state.visible[id];\n    return `opacity:${shown ? 1 : 0}; transform:translateY(${shown ? 0 : 28}px); transition:opacity 0.9s cubic-bezier(.22,1,.36,1), transform 0.9s cubic-bezier(.22,1,.36,1);`;\n  }\n\n  renderVals() {\n    const ids = ['hero','heroImg','aboutImg','about','serviciosTitle','servicios','credencialesTitle','credenciales','testimonial','contactoTitle','contacto','form'];\n    const reveal = {};\n    ids.forEach(id => { reveal[id] = this.revealStyle(id) + ` --reveal-id:${id};`; });\n\n    const isMobile = this.state.isMobile;\n    const activeBg = this.props.serviceActiveBg ?? '#5A9AF3';\n    const activeText = this.props.serviceActiveText ?? '#FEFCED';\n    const SERVICES = [\n      { id: 'acomp', title: 'ACOMPAÑAMIENTO PSICOLÓGICO', desc: 'Apoyo terapéutico para: ansiedad y depresión, manejo del estrés, regulación emocional, autoestima.' },\n      { id: 'eval', title: 'EVALUACIÓN E INTERVENCIÓN NEUROPSICOLÓGICA', desc: 'Enfocada en: problemas de memoria y atención, dificultades de organización y planificación, habilidades sociales, deterioro o daño cognitivo.' }\n    ];\n    const expandedService = this.state.expandedService;\n    const hoveredService = this.state.hoveredService;\n    const services = SERVICES.map((s, i) => {\n      const isActive = expandedService === s.id;\n      const isHovered = hoveredService === s.id;\n      const bg = (isActive || isHovered) ? activeBg : '#FEFCED';\n      const textColor
